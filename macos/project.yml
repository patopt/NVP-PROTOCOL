name: NVPMac
options:
  bundleIdPrefix: com.nvp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minVersion: "2.31.0"
    maxVersion: "3.0.0"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minVersion: "0.31.0"
    maxVersion: "0.32.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minVersion: "1.2.0"
    maxVersion: "1.3.0"

targets:
  NVPMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NVPMac
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift
        product: MLX
      - package: swift-transformers
        product: Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nvp.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: NVP Worker
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Unsigned local/dev build: no App Sandbox (outbound network + model cache).
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "5.0"

schemes:
  NVPMac:
    build:
      targets:
        NVPMac: all
    run:
      config: Debug
